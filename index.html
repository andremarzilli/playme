<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play.me Playroom - Sound Toy</title>
    <style>
        :root {
            --bg-color: #fff9e6;
            --panel-color: #ffffff;
            --orange: #ff6b35;
            --yellow: #f7c544;
            --mint: #4ecdc4;
            --dark: #2b2d42;
            --gray: #e8e3d7;
        }

        body {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            font-family: 'Comic Sans MS', system-ui, sans-serif;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; overflow: hidden; user-select: none;
        }

        .blob-bg {
            position: absolute; width: 100%; height: 100%; z-index: -1; filter: blur(60px); opacity: 0.7;
        }
        .blob { position: absolute; border-radius: 50%; animation: float 8s infinite alternate ease-in-out; }
        .blob1 { top: 5%; left: 5%; width: 400px; height: 400px; background: var(--orange); }
        .blob2 { bottom: 5%; right: 5%; width: 500px; height: 500px; background: var(--yellow); }
        @keyframes float { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(40px, 40px) scale(1.2); } }

        .toy-container {
            background: var(--panel-color);
            padding: 30px; border-radius: 55px;
            box-shadow: 0 35px 0px var(--gray), 0 40px 70px rgba(0,0,0,0.08);
            width: 90%; max-width: 550px;
            position: relative; border: 5px solid var(--dark);
        }

        .audio-unlocker {
            position: absolute; top: -5px; left: -5px; width: calc(100% + 10px); height: calc(100% + 10px);
            background: #ff6b35; border-radius: 55px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 10; border: 5px solid var(--dark); transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .unlock-btn {
            background: var(--yellow); color: var(--dark);
            border: 4px solid var(--dark); padding: 25px 60px;
            font-size: 28px; font-weight: 900; border-radius: 40px;
            cursor: pointer; box-shadow: 0 12px 0 var(--dark);
            transform: translateY(-6px); transition: all 0.1s;
        }
        .unlock-btn:active { transform: translateY(2px); box-shadow: 0 4px 0 var(--dark); }

        .screen {
            background: var(--dark); color: #fff; padding: 15px;
            border-radius: 25px; text-align: center; font-size: 16px;
            margin-bottom: 25px; font-weight: bold; box-shadow: inset 0 5px 0px rgba(0,0,0,0.2);
        }

        .wave-selector {
            display: flex; justify-content: space-between; gap: 10px; margin-bottom: 25px;
        }
        .wave-btn {
            flex: 1; padding: 15px 5px; border: 3px solid var(--dark);
            border-radius: 22px; background: white; font-weight: 900; font-size: 14px;
            cursor: pointer; box-shadow: 0 5px 0 var(--dark); transition: all 0.1s;
        }
        .wave-btn.active {
            background: var(--mint); color: white; transform: translateY(3px); box-shadow: 0 2px 0 var(--dark);
        }

        .sequencer-card {
            background: #fdfaf4; border: 4px solid var(--dark);
            border-radius: 35px; padding: 20px 15px; margin-bottom: 25px;
        }
        .grid-dynamic {
            display: flex; justify-content: space-between; height: 160px;
            align-items: flex-end; position: relative; background: #fff;
            border-radius: 20px; border: 3px dashed var(--gray); padding: 10px;
        }
        .step-column {
            display: flex; flex-direction: column; align-items: center;
            justify-content: flex-end; height: 100%; width: 11%; position: relative;
        }
        .kid-bubble {
            width: 38px; height: 38px; border-radius: 50%;
            background: var(--gray); border: 3px solid var(--dark);
            position: absolute; bottom: 0; cursor: pointer;
            transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s, transform 0.1s;
        }
        .kid-bubble.active {
            background: var(--orange);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .kid-bubble.playing {
            transform: scale(1.3);
            border-color: var(--yellow);
            box-shadow: 0 0 15px var(--orange);
        }

        .len-slider {
            width: 80%; margin-top: 5px; accent-color: var(--dark); cursor: pointer;
        }

        .fx-section {
            background: #fdfaf4; border: 4px solid var(--dark);
            border-radius: 35px; padding: 20px;
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px;
        }
        .fx-knob { display: flex; flex-direction: column; }
        .fx-knob label { font-size: 12px; font-weight: 900; margin-bottom: 6px; text-transform: uppercase; }
        .fx-knob input[type=range] { width: 100%; accent-color: var(--orange); cursor: pointer; }

        .transport-bar {
            display: flex; gap: 10px; margin-top: 20px;
        }
        .btn-play {
            flex: 2; padding: 15px; background: var(--yellow); border: 3px solid var(--dark);
            border-radius: 25px; font-weight: 900; font-size: 18px; cursor: pointer;
            box-shadow: 0 6px 0 var(--dark);
        }
        .btn-play.active { background: var(--mint); color: white; transform: translateY(3px); box-shadow: 0 3px 0 var(--dark); }
        .btn-clear {
            flex: 1; padding: 15px; background: white; border: 3px solid var(--dark);
            border-radius: 25px; font-weight: 900; cursor: pointer; box-shadow: 0 6px 0 var(--dark);
        }
    </style>
</head>
<body>

    <div class="blob-bg"><div class="blob blob1"></div><div class="blob blob2"></div></div>

    <div class="toy-container">
        <div class="audio-unlocker" id="unlocker">
            <h1 style="color: white; font-size: 46px; margin: 0 0 5px 0; font-weight: 900;">play.me 🧸</h1>
            <p style="color: white; font-size: 16px; margin-bottom: 30px; font-weight: bold;">Il tuo giocattolo musicale spaziale!</p>
            <button class="unlock-btn" onclick="initAudioMachine()">ENTRA E SUONA! 🚀</button>
        </div>

        <div class="screen" id="display">Scegli i suoni e muovi le bolle!</div>

        <label style="font-size: 11px; font-weight: 900; display:block; margin-bottom:5px;">1. SCEGLI LA VOCE DEL SYNTH</label>
        <div class="wave-selector">
            <button class="wave-btn active" onclick="setWave('sine', this)">☁️ Dolce</button>
            <button class="wave-btn" onclick="setWave('triangle', this)">📐 Flauto</button>
            <button class="wave-btn" onclick="setWave('sawtooth', this)">⚡ Zanzara</button>
            <button class="wave-btn" onclick="setWave('square', this)">🤖 Robot</button>
        </div>

        <div class="sequencer-card">
            <label style="font-size: 11px; font-weight: 900; display:block; margin-bottom:10px;">2. SPOSTA LE BOLLE IN ALTO E IN BASSO PER CAMBIARE NOTA!</label>
            <div class="grid-dynamic" id="sequencer-grid"></div>
        </div>

        <div class="fx-section">
            <div class="fx-knob">
                <label>Muffola (Filtro)</label>
                <input type="range" id="filterKnob" min="200" max="5000" value="2500" oninput="updateFX()">
            </div>
            <div class="fx-knob">
                <label>Eco (Delay)</label>
                <input type="range" id="delayKnob" min="0" max="80" value="30" oninput="updateFX()">
            </div>
            <div class="fx-knob" style="grid-column: span 2;">
                <label>Stanza Spaziale (Riverbero) 🌌</label>
                <input type="range" id="reverbKnob" min="0" max="100" value="40" oninput="updateFX()">
            </div>
        </div>

        <div class="transport-bar">
            <button class="btn-play" id="playBtn" onclick="togglePlay()">AVVIA MUSICA 🔄</button>
            <button class="btn-clear" onclick="resetAll()">CANCELLA 🧼</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let mainFilter = null;
        let delayNode = null;
        let delayFeedback = null;
        let reverbNode = null;
        let reverbGain = null;

        let currentWave = 'sine';
        let isPlaying = false;
        let currentStep = 0;
        let timerId = null;

        let stepsData = Array.from({length: 8}, () => ({ active: false, pitchStep: 0, duration: 0.2 }));
        const pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

        const grid = document.getElementById('sequencer-grid');
        for(let i=0; i<8; i++) {
            let col = document.createElement('div');
            col.className = 'step-column';
            
            let bubble = document.createElement('div');
            bubble.className = 'kid-bubble';
            bubble.id = `bubble-${i}`;
            bubble.onclick = () => handleBubbleClick(i);
            
            let lenSlider = document.createElement('input');
            lenSlider.type = 'range';
            lenSlider.className = 'len-slider';
            lenSlider.min = '0.05'; lenSlider.max = '0.8'; lenSlider.step = '0.05'; lenSlider.value = '0.2';
            lenSlider.oninput = (e) => { stepsData[i].duration = parseFloat(e.target.value); };

            col.appendChild(bubble);
            col.appendChild(lenSlider);
            grid.appendChild(col);
        }

        function handleBubbleClick(index) {
            let data = stepsData[index];
            if (!data.active) {
                data.active = true;
                data.pitchStep = 0;
            } else {
                data.pitchStep = (data.pitchStep + 1) % 6;
                if (data.pitchStep === 0) {
                    data.active = false;
                }
            }
            renderSequencerUI();
            if (data.active && audioCtx) playPreviewTone(pentatonicScale[data.pitchStep], data.duration);
        }

        function renderSequencerUI() {
            for(let i=0; i<8; i++) {
                let bubble = document.getElementById(`bubble-${i}`);
                let data = stepsData[i];
                if(data.active) {
                    bubble.classList.add('active');
                    bubble.style.bottom = `${(data.pitchStep * 22) + 25}px`;
                } else {
                    bubble.classList.remove('active');
                    bubble.style.bottom = '25px';
                }
            }
        }

        function setWave(wave, btn) {
            currentWave = wave;
            document.querySelectorAll('.wave-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('display').innerText = `Voce cambiata in: ${btn.innerText}`;
        }

        function initAudioMachine() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            mainFilter = audioCtx.createBiquadFilter();
            mainFilter.type = 'lowpass';

            delayNode = audioCtx.createDelay();
            delayFeedback = audioCtx.createGain();
            delayNode.delayTime.value = 0.25;

            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = createReverbImpulseResponse(2.5, 2.0);
            reverbGain = audioCtx.createGain();

            delayNode.connect(delayFeedback);
            delayFeedback.connect(delayNode);
            reverbNode.connect(reverbGain);

            document.getElementById('unlocker').style.transform = 'translateY(-110%)';
            updateFX();
        }

        function createReverbImpulseResponse(duration, decay) {
            let sampleRate = 44100;
            let length = sampleRate * duration;
            let impulse = new (window.AudioContext || window.webkitAudioContext)().createBuffer(2, length, sampleRate);
            let left = impulse.getChannelData(0);
            let right = impulse.getChannelData(1);
            for (let i = 0; i < length; i++) {
                let percent = i / length;
                let formula = Math.pow(1 - percent, decay) * (Math.random() * 2 - 1);
                left[i] = formula; right[i] = formula;
            }
            return impulse;
        }

        function updateFX() {
            if(!audioCtx) return;
            let f = document.getElementById('filterKnob').value;
            let d = document.getElementById('delayKnob').value / 100;
            let r = document.getElementById('reverbKnob').value / 100;

            mainFilter.frequency.setValueAtTime(f, audioCtx.currentTime);
            delayFeedback.gain.setValueAtTime(d, audioCtx.currentTime);
            reverbGain.gain.setValueAtTime(r, audioCtx.currentTime);
        }

        function togglePlay() {
            if(!audioCtx) return;
            isPlaying = !isPlaying;
            let btn = document.getElementById('playBtn');
            if(isPlaying) {
                btn.innerText = "FERMA IL GIOCO 🛑";
                btn.classList.add('active');
                currentStep = 0;
                runLoop();
            } else {
                btn.innerText = "AVVIA MUSICA 🔄";
                btn.classList.remove('active');
                clearTimeout(timerId);
                document.querySelectorAll('.kid-bubble').forEach(b => b.classList.remove('playing'));
            }
        }

        function runLoop() {
            let bubbles = document.querySelectorAll('.kid-bubble');
            bubbles.forEach(b => b.classList.remove('playing'));
            
            let activeBubble = document.getElementById(`bubble-${currentStep}`);
            if(activeBubble) activeBubble.classList.add('playing');

            let stepData = stepsData[currentStep];
            if(stepData && stepData.active) {
                playFatTone(pentatonicScale[stepData.pitchStep], stepData.duration);
            }

            currentStep = (currentStep + 1) % 8;
            timerId = setTimeout(runLoop, 300);
        }

        function playFatTone(freq, duration) {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();

            osc.type = currentWave;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

            osc.connect(mainFilter);
            mainFilter.connect(gain);
            
            gain.connect(audioCtx.destination);
            gain.connect(delayNode);
            gain.connect(reverbNode);

            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playPreviewTone(freq, duration) {
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = currentWave;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function resetAll() {
            stepsData = Array.from({length: 8}, () => ({ active: false, pitchStep: 0, duration: 0.2 }));
            document.querySelectorAll('.len-slider').forEach(s => s.value = 0.2);
            renderSequencerUI();
            document.getElementById('display').innerText = "Tutto pulito! Ricomincia da capo.";
        }
    </script>
</body>
</html>
