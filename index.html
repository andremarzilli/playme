<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play.me Playroom</title>
    <style>
        :root { --bg: #fff9e6; --panel: #fff; --orange: #ff6b35; --yellow: #f7c544; --mint: #4ecdc4; --dark: #2b2d42; --gray: #e8e3d7; }
        body { margin: 0; background: var(--bg); font-family: 'Comic Sans MS', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; user-select: none; }
        .blob-bg { position: absolute; width: 100%; height: 100%; z-index: -1; filter: blur(60px); opacity: 0.7; }
        .blob { position: absolute; border-radius: 50%; animation: float 8s infinite alternate ease-in-out; }
        .blob1 { top: 5%; left: 5%; width: 300px; height: 300px; background: var(--orange); }
        .blob2 { bottom: 5%; right: 5%; width: 400px; height: 400px; background: var(--yellow); }
        @keyframes float { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(30px, 30px) scale(1.1); } }
        .toy-container { background: var(--panel); padding: 25px; border-radius: 45px; box-shadow: 0 25px 0 var(--gray), 0 30px 50px rgba(0,0,0,0.05); width: 90%; max-width: 500px; position: relative; border: 5px solid var(--dark); }
        .audio-unlocker { position: absolute; top: -5px; left: -5px; width: calc(100% + 10px); height: calc(100% + 10px); background: var(--orange); border-radius: 45px; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; border: 5px solid var(--dark); transition: all 0.5s ease; }
        .unlock-btn { background: var(--yellow); color: var(--dark); border: 4px solid var(--dark); padding: 20px 50px; font-size: 24px; font-weight: 900; border-radius: 35px; cursor: pointer; box-shadow: 0 10px 0 var(--dark); transform: translateY(-5px); }
        .unlock-btn:active { transform: translateY(1px); box-shadow: 0 4px 0 var(--dark); }
        .screen { background: var(--dark); color: #fff; padding: 12px; border-radius: 20px; text-align: center; margin-bottom: 20px; font-weight: bold; }
        .wave-selector { display: flex; gap: 8px; margin-bottom: 20px; }
        .wave-btn { flex: 1; padding: 12px 5px; border: 3px solid var(--dark); border-radius: 18px; background: white; font-weight: 900; font-size: 13px; cursor: pointer; box-shadow: 0 4px 0 var(--dark); }
        .wave-btn.active { background: var(--mint); color: white; transform: translateY(2px); box-shadow: 0 2px 0 var(--dark); }
        .sequencer-card { background: #fdfaf4; border: 4px solid var(--dark); border-radius: 30px; padding: 15px; margin-bottom: 20px; }
        .grid-dynamic { display: flex; justify-content: space-between; height: 150px; background: #fff; border-radius: 15px; border: 3px dashed var(--gray); padding: 8px; position: relative; }
        .step-column { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; width: 11%; position: relative; }
        .kid-bubble { width: 34px; height: 34px; border-radius: 50%; background: var(--gray); border: 3px solid var(--dark); position: absolute; bottom: 25px; cursor: pointer; transition: bottom 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275), background 0.3s, transform 0.1s; }
        .kid-bubble.active { background: var(--orange); }
        .kid-bubble.playing { transform: scale(1.25); border-color: var(--yellow); box-shadow: 0 0 12px var(--orange); }
        .len-slider { width: 80%; margin-top: 5px; accent-color: var(--dark); cursor: pointer; }
        .fx-section { background: #fdfaf4; border: 4px solid var(--dark); border-radius: 30px; padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .fx-knob { display: flex; flex-direction: column; }
        .fx-knob label { font-size: 11px; font-weight: 900; margin-bottom: 4px; text-transform: uppercase; }
        .fx-knob input { width: 100%; accent-color: var(--orange); cursor: pointer; }
        .transport-bar { display: flex; gap: 8px; margin-top: 15px; }
        .btn-play { flex: 2; padding: 12px; background: var(--yellow); border: 3px solid var(--dark); border-radius: 20px; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 5px 0 var(--dark); }
        .btn-play.active { background: var(--mint); color: white; transform: translateY(2px); box-shadow: 0 3px 0 var(--dark); }
        .btn-clear { flex: 1; padding: 12px; background: white; border: 3px solid var(--dark); border-radius: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 5px 0 var(--dark); }
    </style>
</head>
<body>
    <div class="blob-bg"><div class="blob blob1"></div><div class="blob blob2"></div></div>
    <div class="toy-container">
        <div class="audio-unlocker" id="unlocker">
            <h1 style="color: white; font-size: 40px; margin: 0; font-weight: 900;">play.me 🧸</h1>
            <p style="color: white; font-size: 14px; margin-bottom: 20px; font-weight: bold;">Giocattolo musicale spaziale!</p>
            <button class="unlock-btn" onclick="initAudioMachine()">ENTRA E SUONA! 🚀</button>
        </div>
        <div class="screen" id="display">Muovi le bolle per creare note!</div>
        <div class="wave-selector">
            <button class="wave-btn active" onclick="setWave('sine', this)">☁️ Dolce</button>
            <button class="wave-btn" onclick="setWave('triangle', this)">📐 Flauto</button>
            <button class="wave-btn" onclick="setWave('sawtooth', this)">⚡ Zanzara</button>
            <button class="wave-btn" onclick="setWave('square', this)">🤖 Robot</button>
        </div>
        <div class="sequencer-card">
            <div class="grid-dynamic" id="sequencer-grid"></div>
        </div>
        <div class="fx-section">
            <div class="fx-knob"><label>Filtro</label><input type="range" id="filterKnob" min="200" max="5000" value="2500" oninput="updateFX()"></div>
            <div class="fx-knob"><label>Eco</label><input type="range" id="delayKnob" min="0" max="80" value="30" oninput="updateFX()"></div>
            <div class="fx-knob" style="grid-column: span 2;"><label>Spazio 🌌</label><input type="range" id="reverbKnob" min="0" max="100" value="40" oninput="updateFX()"></div>
        </div>
        <div class="transport-bar">
            <button class="btn-play" id="playBtn" onclick="togglePlay()">AVVIA MUSICA 🔄</button>
            <button class="btn-clear" onclick="resetAll()">CANCELLA 🧼</button>
        </div>
    </div>
    <script>
        let audioCtx = null, mainFilter = null, delayNode = null, delayFeedback = null, reverbNode = null, reverbGain = null;
        let currentWave = 'sine', isPlaying = false, currentStep = 0, timerId = null;
        let stepsData = Array.from({length: 8}, () => ({ active: false, pitchStep: 0, duration: 0.2 }));
        const scale = [261.63, 293.66, 329.63, 392.00, 440.00, 523.25];

        const grid = document.getElementById('sequencer-grid');
        for(let i=0; i<8; i++) {
            let col = document.createElement('div'); col.className = 'step-column';
            let bubble = document.createElement('div'); bubble.className = 'kid-bubble'; bubble.id = `bubble-${i}`; bubble.onclick = () => handleBubble(i);
            let slider = document.createElement('input'); slider.type = 'range'; slider.className = 'len-slider'; slider.min = '0.05'; slider.max = '0.8'; slider.step = '0.05'; slider.value = '0.2';
            slider.oninput = (e) => { stepsData[i].duration = parseFloat(e.target.value); };
            col.appendChild(bubble); col.appendChild(slider); grid.appendChild(col);
        }
        function handleBubble(i) {
            let d = stepsData[i];
            if (!d.active) { d.active = true; d.pitchStep = 0; }
            else { d.pitchStep = (d.pitchStep + 1) % 6; if (d.pitchStep === 0) d.active = false; }
            renderUI();
            if (d.active && audioCtx) playTone(scale[d.pitchStep], d.duration);
        }
        function renderUI() {
            for(let i=0; i<8; i++) {
                let b = document.getElementById(`bubble-${i}`), d = stepsData[i];
                if(d.active) { b.classList.add('active'); b.style.bottom = `${(d.pitchStep * 20) + 25}px`; }
                else { b.classList.remove('active'); b.style.bottom = '25px'; }
            }
        }
        function setWave(w, btn) { currentWave = w; document.querySelectorAll('.wave-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); }
        function initAudioMachine() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            mainFilter = audioCtx.createBiquadFilter(); mainFilter.type = 'lowpass';
            delayNode = audioCtx.createDelay(); delayFeedback = audioCtx.createGain(); delayNode.delayTime.value = 0.25;
            reverbNode = audioCtx.createConvolver(); reverbNode.buffer = createReverb(2.0, 1.5); reverbGain = audioCtx.createGain();
            delayNode.connect(delayFeedback); delayFeedback.connect(delayNode); reverbNode.connect(reverbGain);
            document.getElementById('unlocker').style.transform = 'translateY(-110%)'; updateFX();
        }
        function createReverb(dur, dec) {
            let rate = 44100, len = rate * dur, imp = new (window.AudioContext || window.webkitAudioContext)().createBuffer(2, len, rate);
            let l = imp.getChannelData(0), r = imp.getChannelData(1);
            for (let i = 0; i < len; i++) { let p = i / len, f = Math.pow(1 - p, dec) * (Math.random() * 2 - 1); l[i] = f; r[i] = f; }
            return imp;
        }
        function updateFX() {
            if(!audioCtx) return;
            mainFilter.frequency.setValueAtTime(document.getElementById('filterKnob').value, audioCtx.currentTime);
            delayFeedback.gain.setValueAtTime(document.getElementById('delayKnob').value / 100, audioCtx.currentTime);
            reverbGain.gain.setValueAtTime(document.getElementById('reverbKnob').value / 100, audioCtx.currentTime);
        }
        function togglePlay() {
            if(!audioCtx) return; isPlaying = !isPlaying; let btn = document.getElementById('playBtn');
            if(isPlaying) { btn.innerText = "FERMA IL GIOCO 🛑"; btn.classList.add('active'); currentStep = 0; run(); }
            else { btn.innerText = "AVVIA MUSICA 🔄"; btn.classList.remove('active'); clearTimeout(timerId); document.querySelectorAll('.kid-bubble').forEach(b => b.classList.remove('playing')); }
        }
        function run() {
            document.querySelectorAll('.kid-bubble').forEach(b => b.classList.remove('playing'));
            let ab = document.getElementById(`bubble-${currentStep}`); if(ab) ab.classList.add('playing');
            let sd = stepsData[currentStep]; if(sd && sd.active) playSynth(scale[sd.pitchStep], sd.duration);
            currentStep = (currentStep + 1) % 8; timerId = setTimeout(run, 300);
        }
        function playSynth(freq, dur) {
            let osc = audioCtx.createOscillator(), g = audioCtx.createGain(); osc.type = currentWave; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(mainFilter); mainFilter.connect(g); g.connect(audioCtx.destination); g.connect(delayNode); g.connect(reverbNode);
            osc.start(); osc.stop(audioCtx.currentTime + dur);
        }
        function playTone(freq, dur) {
            let osc = audioCtx.createOscillator(), g = audioCtx.createGain(); osc.type = currentWave; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            g.gain.setValueAtTime(0.1, audioCtx.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
            osc.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + dur);
        }
        function resetAll() { stepsData = Array.from({length: 8}, () => ({ active: false, pitchStep: 0, duration: 0.2 })); renderUI(); }
    </script>
</body>
</html>
